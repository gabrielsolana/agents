design_task:
  description: >
    Toma los requisitos de alto nivel descritos aquí y prepara un diseño detallado para el equipo de ingeniería;
    Estos son los requisitos: {requirements}
    IMPORTANTE: Entrega únicamente el diseño en formato markdown, exponiendo el/los módulo(s), clases y funciones.
    No escribas código. Solo firmas de funciones o métodos.
    Debes asignar trabajo a los siguientes ingenieros: backend_engineer, frontend_engineer, test_engineer.
    El backend_engineer debe escribir el código Python del backend.
    El frontend_engineer debe crear una aplicación gradio.
    El test_engineer debe escribir pruebas unitarias del módulo de backend.
    Todos los ingenieros trabajarán en el mismo directorio del sandbox. Los módulos, app.py y las pruebas test_*.py están todos en la raíz del sandbox, sin paquetes; los scripts auxiliares (validación, comprobaciones, pruebas de humo, parches puntuales) se escriben en la subcarpeta scripts/ y se ejecutan con run_sandbox_python (por ejemplo scripts/_validate.py); la raíz del sandbox ya está en el PYTHONPATH, así que pueden hacer `import accounting` o `import app` sin tocar sys.path.
    Los informes en markdown (diseño, revisiones, resumen de pruebas, manual, informe de coste) se guardan solos en la subcarpeta docs/; los ingenieros no deben escribir ahí.
    Todo se ejecuta en un proyecto uv con gradio instalado.
  expected_output: >
    Un diseño detallado para cumplir los requisitos, que identifique la estructura del código y las asignaciones a los ingenieros.
  agent: engineering_lead
  output_file: sandbox/docs/design.md

code_task:
  description: >
    Escribe código Python que implemente el diseño descrito por el líder de ingeniería, para cumplir los requisitos.
    Estos son los requisitos: {requirements}
  expected_output: >
    Archivos Python escritos en el sandbox y probados que implementen el diseño y cumplan los requisitos.
    IMPORTANTE: Usa tus herramientas del sandbox para escribir y comprobar el código.
    La herramienta Check Code Quality debe dar PASS sobre el backend.
  agent: backend_engineer
  context:
    - design_task

frontend_task:
  description: >
    Escribe una interfaz gradio en un módulo app.py que muestre el código del backend, tal como se describe en el diseño.
    Supón que hay un solo usuario y que la interfaz debe ser profesional, cuidada y limpia.
    Después escribe un script de validación independiente (p. ej. scripts/_validate.py) que importe app.py y confirme que el objeto Blocks se construye sin errores, y ejecútalo con tus herramientas del sandbox.
    IMPORTANTE: el script de validación NO debe llamar a `.launch()`, porque se bloquearía hasta agotar el tiempo. Solo debe importar e instanciar.
    app.py debe exponer un `demo` a nivel de módulo y lanzarlo únicamente bajo `if __name__ == "__main__"`.
    Muestra la versión de la aplicación en la cabecera, leyéndola con `from version import __version__`; el archivo version.py lo crea y gestiona el sistema, no lo escribas ni lo edites.
    Estos son los requisitos: {requirements}
  expected_output: >
    Una interfaz gradio en el módulo app.py, escrita en el sandbox, que muestre la funcionalidad.
    El archivo debe quedar listo para ejecutarse tal cual, en el mismo directorio del sandbox que el código del backend.
    IMPORTANTE: Usa tus herramientas del sandbox para escribir y comprobar el código.
    La herramienta Check Code Quality debe dar PASS sobre app.py.
  agent: frontend_engineer
  context:
    - code_task
    - design_task

ux_review_task:
  description: >
    Revisa la aplicación Gradio (app.py) como el dueño del negocio que la usará cada día.
    Usa inspect_gradio_layout y lee el código. Cubre todas las pestañas. Recuerda el principio: en cada pestaña el listado es el
    elemento central y los formularios de alta se alcanzan mediante un botón (o acordeón/modal), sin ocupar la mitad de la pantalla.
    Estos son los requisitos: {requirements}
  expected_output: >
    Una revisión en español, en markdown: primero un breve veredicto general y después una tabla o lista de observaciones ordenadas por prioridad
    (alta / media / baja), cada una con pestaña, problema y el cambio concreto propuesto.
  agent: ux_reviewer
  context:
    - design_task
    - frontend_task
  output_file: sandbox/docs/ux_review.md

fiscal_review_task:
  description: >
    Revisa el backend en cuanto a corrección contable y del IVA español, escribiendo y ejecutando comprobaciones de escenarios con
    valores esperados calculados a mano. No modifiques el backend.
    Estos son los requisitos: {requirements}
  expected_output: >
    Un informe en español, en markdown: escenarios probados, valor esperado frente a valor obtenido en cada uno, y la lista de discrepancias
    ordenadas por gravedad. Si todo es correcto, indica qué escenarios respaldan esa conclusión.
  agent: fiscal_reviewer
  context:
    - design_task
    - code_task
  output_file: sandbox/docs/fiscal_review.md

requirements_audit_task:
  description: >
    Audita el sistema entregado frente a los requisitos. Construye la matriz de trazabilidad, con una fila por requisito.
    Estos son los requisitos: {requirements}
  expected_output: >
    Un informe en markdown, en español, con la matriz (requisito, evidencia, estado cubierto/parcial/ausente) y, al principio,
    la lista de requisitos parciales o ausentes indicando exactamente qué falta.
  agent: requirements_auditor
  context:
    - design_task
    - code_task
    - frontend_task
  output_file: sandbox/docs/requirements_audit.md

code_review_task:
  description: >
    Revisa la calidad y la mantenibilidad del código del sistema (backend, app.py y pruebas). Ejecuta primero Check Code Quality y lee el código.
    No lo modifiques: tu informe lo recibe el líder de ingeniería, que decide qué se aplica.
    Estos son los requisitos, para que juzgues el diseño en su contexto: {requirements}
  expected_output: >
    Una revisión en español, en markdown: un veredicto general breve y una lista de hallazgos ordenados por prioridad (alta / media / baja), cada uno con
    archivo y función o clase, problema, cambio propuesto, riesgo de regresión (bajo / medio / alto) y responsable (backend_engineer o frontend_engineer).
  agent: code_reviewer
  context:
    - design_task
    - code_task
    - frontend_task
  output_file: sandbox/docs/code_review.md

review_decision_task:
  description: >
    Tienes cuatro revisiones independientes del sistema: UX, fiscal/IVA, cobertura de requisitos y calidad de código. Decide qué se hace.
    Lee app.py o el backend si lo necesitas para valorar la viabilidad. Para cada hallazgo, ACÉPTALO o RECHÁZALO con una razón de una línea,
    dando prioridad a los cambios que importan al usuario final o corrigen errores reales, y rechazando cuestiones de gusto, trivialidades
    y todo lo que arriesgue romper código que funciona. Acepta una refactorización del revisor de código solo si el riesgo de regresión es bajo o hay pruebas que la protejan. Acepta como máximo 12 cambios en total. Asigna cada cambio aceptado a backend_engineer o
    frontend_engineer. Los cambios de backend no deben alterar firmas públicas de métodos usadas por app.py, salvo que el cambio incluya también
    la actualización de frontend correspondiente. No escribas código.
  expected_output: >
    Un documento en markdown, en español, con dos secciones: "Aceptados" (id, revisión de origen, cambio, responsable, cómo verificarlo) y
    "Rechazados" (id, revisión de origen, motivo).
  agent: engineering_lead
  context:
    - ux_review_task
    - fiscal_review_task
    - requirements_audit_task
    - code_review_task
  output_file: sandbox/docs/review_decision.md

backend_fix_task:
  description: >
    Aplica ÚNICAMENTE los cambios asignados a backend_engineer en la decisión de revisión del líder de ingeniería. No toques nada más.
    Después de cada cambio, vuelve a ejecutar las comprobaciones existentes (las pruebas unitarias si existen; si no, un script rápido) y asegúrate de que
    app.py sigue funcionando con el backend.
    Si no hay cambios de backend, no hagas nada y indícalo.
  expected_output: >
    Una lista breve de los cambios de backend aplicados y el resultado de las comprobaciones que se volvieron a ejecutar. Usa tus herramientas del sandbox.
    Check Code Quality debe seguir dando PASS.
  agent: backend_engineer
  context:
    - review_decision_task
    - code_task

ux_revision_task:
  description: >
    Aplica ÚNICAMENTE los cambios asignados a frontend_engineer en la decisión de revisión del líder de ingeniería, además de cualquier actualización
    de frontend que requieran los cambios de backend. No toques nada más. Mantén la paleta de colores y el comportamiento en modo claro/oscuro.
    Después vuelve a ejecutar el script de validación (scripts/_validate.py) con tus herramientas del sandbox; NO debe llamar a `.launch()`.
    Mantén app.py exponiendo un `demo` a nivel de módulo y lanzándolo únicamente bajo `if __name__ == "__main__"`.
    Estos son los requisitos: {requirements}
  expected_output: >
    Una lista breve de los cambios de frontend aplicados y el resultado correcto del script de validación.
    Check Code Quality debe seguir dando PASS sobre app.py.
  agent: frontend_engineer
  context:
    - review_decision_task
    - backend_fix_task
    - frontend_task

test_task:
  description: >
    Escribe pruebas unitarias del módulo de backend, en un único archivo de pruebas, usando el módulo `unittest` de la biblioteca estándar.
    No escribas pruebas para app.py (el frontend de gradio).
    Corrige cualquier error del código del backend para que las pruebas unitarias pasen.
    Sigue trabajando hasta que todas las pruebas unitarias pasen.
    Si cambias código del backend, asegúrate de que las pruebas unitarias pasan y de que la aplicación gradio de app.py seguirá funcionando.
    Evita hacer cambios que puedan romper la aplicación gradio de app.py.
    Al terminar, ejecuta Check Code Quality sobre todo el sandbox; si falla por algo que tú has cambiado, corrígelo.
  expected_output: >
    Un único archivo de pruebas que se pueda ejecutar para probar el módulo de backend.
    IMPORTANTE: Usa tus herramientas del sandbox para escribir y ejecutar las pruebas unitarias.
    Entrega un resumen de los resultados de las pruebas unitarias.
  agent: test_engineer
  context:
    - code_task
    - design_task
  output_file: sandbox/docs/test_summary.md

manual_task:
  description: >
    Escribe el manual de usuario de la aplicación terminada, en español, basado en lo que la interfaz y el código contienen realmente.
    Cita exactamente los nombres de pestañas, botones y etiquetas de campos. Confírmalos con inspect_gradio_layout antes de escribir.
  expected_output: >
    Un manual de usuario en markdown, en español: introducción y cómo iniciar la aplicación, una sección por pestaña con pasos numerados para
    cada tarea, errores habituales y soluciones, y un glosario. Todo lo que no se haya podido confirmar queda señalado como tal.
  agent: manual_writer
  context:
    - design_task
    - review_decision_task
    - test_task
  output_file: sandbox/docs/manual_usuario.md

release_task:
  description: >
    Registra la primera versión de la aplicación. Llama UNA sola vez a la herramienta Register Release con bump=major (la versión pasa de 0.0.0 a 1.0.0),
    un resumen de una o dos frases y, en `added`, las funcionalidades principales de la aplicación (una frase corta orientada al usuario, en español,
    basada en los requisitos y en lo que consta en el manual); `fixed` va vacío porque es la primera versión.
    Reglas de versionado (MAYOR.MENOR.PARCHE): con funcionalidad nueva, bump=minor; solo con correcciones o mejoras internas, bump=patch;
    con un cambio incompatible (por ejemplo, en el formato de los datos guardados), bump=major. Las refactorizaciones, pruebas y mejoras de calidad
    que no cambian lo que ve o hace el usuario van en `improved`. La herramienta calcula el número
    y rechaza combinaciones incoherentes; no edites version.py ni docs/versiones.md a mano, no puedes.
    Usa solo lo que consta en la documentación y en las revisiones; no inventes funciones.
  expected_output: >
    La confirmación de la herramienta con la versión registrada y el texto de la entrada del historial.
  agent: release_manager
  context:
    - requirements_audit_task
    - review_decision_task
    - manual_task

cost_report_task:
  description: >
    Mide el gasto real de esta ejecución y redacta un informe del coste total.
    Llama a la herramienta Report Token Usage: te da los tokens reales por agente y en total, y el coste estimado con las
    tarifas de config/tarifas.yaml. Usa ÚNICAMENTE las cifras que devuelva la herramienta; no calcules ni inventes precios ni tokens.
    Si algún modelo aparece como "sin tarifa", dilo claramente y no estimes su coste.
    La herramienta también da el tiempo de reloj: por tarea, por agente y total. Incluye ese tiempo en el informe, con las mismas
    reglas: solo las cifras de la herramienta, sin estimar nada por tu cuenta.
  expected_output: >
    Un informe en markdown, en español: tabla de tokens y coste por agente y total (copiada de la herramienta), qué agentes o
    modelos concentran el gasto y en qué porcentaje, el tiempo total de la ejecución y la tabla de tiempo por tarea y por agente
    (qué tareas o agentes concentran más tiempo), qué falta por contabilizar (tarifas sin rellenar, llamadas posteriores a
    la medición) y una advertencia de que es una estimación y no la factura de Console.
  agent: release_manager
  context:
    - release_task
  output_file: sandbox/docs/informe_coste.md

change_design_task:
  description: >
    Se pide un CAMBIO sobre una aplicación que YA EXISTE en el sandbox; no es una aplicación nueva.
    Petición de cambio: {cambio}
    Antes de diseñar, lee el código existente con tus herramientas: lista los archivos, lee el/los módulo(s) del backend y app.py,
    y docs/design.md si existe. Diseña SOLO el delta necesario para cumplir la petición:
    qué clases, funciones o componentes se añaden o se modifican, con sus firmas. No escribas código.
    Reglas: reutiliza lo que ya existe; no cambies firmas públicas usadas por app.py salvo que el cambio lo exija y, en ese caso,
    indica la actualización de frontend correspondiente; no toques nada que no haga falta. Asigna el trabajo a backend_engineer,
    frontend_engineer y test_engineer, e indica los riesgos de regresión y cómo verificar el cambio.
  expected_output: >
    Un documento en markdown, en español: resumen del cambio, archivos y funciones afectados (nuevos o modificados) con sus firmas,
    asignación a cada ingeniero, riesgos de regresión y cómo verificarlo.
  agent: engineering_lead
  output_file: sandbox/docs/cambio_{cambio_id}_diseno.md

change_code_task:
  description: >
    Implementa en el backend SOLO lo que el diseño del cambio te asigna (si no hay diseño aparte, lo que te asigna la decisión aceptada que recibes como contexto). La aplicación ya existe: no la recrees.
    Lee primero el archivo que vayas a tocar y modifícalo con la herramienta Replace In Sandbox File (no reescribas archivos enteros).
    Después de cambiar, ejecuta las pruebas existentes (los archivos test_*.py) con run_sandbox_python; deben seguir pasando.
    Check Code Quality puede listar problemas que ya existían antes de tu cambio: corrige los de lo que añades o modificas
    y no refactorices lo que no tocas.
    Petición de cambio: {cambio}
  expected_output: >
    Lista breve de los cambios de backend aplicados (archivo y función) y el resultado de las pruebas existentes.
  agent: backend_engineer
  context:
    - change_design_task

change_frontend_task:
  description: >
    Adapta app.py SOLO a lo que el diseño del cambio te asigna (o la decisión aceptada, si no hay diseño aparte), más cualquier ajuste que exijan los cambios de backend. La interfaz ya existe: no la recrees.
    Lee primero app.py y modifícalo con Replace In Sandbox File. Si la cabecera aún no muestra la versión, añádela leyéndola con `from version import __version__` (version.py lo gestiona el sistema; no lo edites). Mantén la paleta, el modo claro/oscuro, el `demo` a nivel de módulo
    y el lanzamiento únicamente bajo `if __name__ == "__main__"`. Ejecuta scripts/_validate.py (sin llamar a `.launch()`); solo si el diseño lo pide, amplíalo. No modifiques ningún otro archivo que el diseño no mencione.
    Las funciones nuevas deben cumplir los estándares (máximo 40 líneas, tipos y docstring); no refactorices lo que no tocas.
    Petición de cambio: {cambio}
  expected_output: >
    Lista breve de los cambios de frontend aplicados y el resultado correcto de scripts/_validate.py.
  agent: frontend_engineer
  context:
    - change_design_task
    - change_code_task

change_test_task:
  description: >
    Escribe pruebas unitarias (módulo `unittest`) para el comportamiento nuevo o modificado, en un archivo nuevo test_cambio_{cambio_id}.py.
    No reescribas las pruebas existentes. Ejecuta TODAS las pruebas (cada archivo test_*.py) y corrige los defectos del backend que encuentres;
    si cambias código del backend, mantén los estándares y comprueba que app.py sigue construyéndose con scripts/_validate.py.
    Petición de cambio: {cambio}
  expected_output: >
    Un resumen en markdown de las pruebas nuevas y del resultado de la suite completa (cuántas pasan, cuántas fallan y por qué).
  agent: test_engineer
  context:
    - change_design_task
    - change_code_task
    - change_frontend_task
  output_file: sandbox/docs/cambio_{cambio_id}_pruebas.md

change_audit_task:
  description: >
    Audita el cambio realizado. Comprueba (1) que la petición se cumple, citando la evidencia concreta que has visto (función, prueba o control de la interfaz),
    (2) que no hay regresiones: ejecuta todas las pruebas y scripts/_validate.py, y (3) que Check Code Quality no empeora en lo que se ha tocado.
    No arregles nada; solo informa, en español, empezando por lo que falte o falle.
    La versión y el historial (version.py, docs/versiones.md) se registran DESPUÉS de tu auditoría: no los señales como pendientes.
    Petición de cambio: {cambio}
  expected_output: >
    Un informe en markdown, en español: veredicto (cumplido / parcial / no cumplido), evidencia, resultado de las pruebas y de scripts/_validate.py,
    y los problemas pendientes ordenados por gravedad.
  agent: requirements_auditor
  context:
    - change_design_task
    - change_code_task
    - change_frontend_task
    - change_test_task
  output_file: sandbox/docs/cambio_{cambio_id}_auditoria.md

change_release_task:
  description: >
    Registra la nueva versión de la aplicación según el cambio realizado. Lee el informe de auditoría: si el veredicto es "no cumplido",
    NO registres versión y explica por qué. En caso contrario, llama UNA sola vez a la herramienta Register Release con el bump que corresponda,
    un resumen de una o dos frases, en `added` la funcionalidad nueva y en `fixed` las correcciones, cada una en una frase corta orientada
    al usuario y en español, basadas solo en lo que consta en el diseño y en la auditoría.
    Reglas de versionado (MAYOR.MENOR.PARCHE): con funcionalidad nueva, bump=minor; solo con correcciones o mejoras internas, bump=patch;
    con un cambio incompatible (por ejemplo, en el formato de los datos guardados), bump=major. Las refactorizaciones, pruebas y mejoras de calidad
    que no cambian lo que ve o hace el usuario van en `improved`. La herramienta calcula el número
    y rechaza combinaciones incoherentes; no edites version.py ni docs/versiones.md a mano, no puedes.
    Petición de cambio: {cambio}
  expected_output: >
    La confirmación de la herramienta con la versión registrada y el texto de la entrada del historial, o la explicación de por qué no se registró.
  agent: release_manager
  context:
    - change_design_task
    - change_audit_task

change_manual_task:
  description: >
    Actualiza el manual de usuario existente (docs/manual_usuario.md) para reflejar el cambio. Léelo primero y edítalo con Replace In Sandbox File,
    modificando o añadiendo solo las secciones afectadas; si no existe, créalo con Write Sandbox File. Cita los nombres de pestañas, botones y campos
    exactamente y confírmalos con inspect_gradio_layout. No describas nada que no hayas comprobado.
    Si el cambio no altera lo que el usuario ve o hace (por ejemplo, una refactorización), no modifiques el manual y dilo.
    Petición de cambio: {cambio}
  expected_output: >
    Una lista breve de las secciones del manual que se han modificado o añadido.
  agent: manual_writer
  context:
    - change_design_task
    - change_frontend_task
    - change_release_task

change_cost_report_task:
  description: >
    Mide el gasto real de esta ejecución del cambio y redacta un informe del coste total.
    Llama a la herramienta Report Token Usage: te da los tokens reales por agente y en total, y el coste estimado con las
    tarifas de config/tarifas.yaml. Usa ÚNICAMENTE las cifras que devuelva la herramienta; no calcules ni inventes precios ni tokens.
    Si algún modelo aparece como "sin tarifa", dilo claramente y no estimes su coste.
    La herramienta también da el tiempo de reloj: por tarea, por agente y total. Incluye ese tiempo en el informe, con las mismas
    reglas: solo las cifras de la herramienta, sin estimar nada por tu cuenta.
    Termina con una sección de comentarios sobre el resultado, basada solo en los informes que ya constan: el informe de auditoría y la versión registrada
    (te llegan como contexto). Si existe docs/aplicar_{cambio_id}_decision.md (ejecución de apply_review), léelo también para saber qué se aceptó y qué se rechazó.
  expected_output: >
    Un informe en markdown, en español: tabla de tokens y coste por agente y total (copiada de la herramienta), qué agentes o
    modelos concentran el gasto y en qué porcentaje, el tiempo total de la ejecución y la tabla de tiempo por tarea y por agente,
    qué falta por contabilizar y una advertencia de que es una estimación y no la factura de Console.
    Cierra con una sección "Comentarios": qué se ha hecho, el veredicto de la auditoría y la versión registrada, las observaciones
    importantes del auditor, lo que queda pendiente o se rechazó, y el siguiente paso que recomiendas.
  agent: release_manager
  context:
    - change_audit_task
    - change_release_task
    - change_manual_task
  output_file: sandbox/docs/cambio_{cambio_id}_informe_coste.md

solo_code_review_task:
  description: >
    Revisa la calidad y la mantenibilidad del código que YA EXISTE en el sandbox (backend, app.py y pruebas). No hay otras tareas previas en esta ejecución:
    lista los archivos, lee el código y, si existe docs/design.md, léelo para conocer el diseño. Ejecuta Check Code Quality.
    No modifiques nada: tu informe es la entrega.
  expected_output: >
    Una revisión en español, en markdown: un veredicto general breve y una lista de hallazgos ordenados por prioridad (alta / media / baja), cada uno con
    archivo y función o clase, problema, cambio propuesto, riesgo de regresión (bajo / medio / alto) y responsable (backend_engineer o frontend_engineer).
  agent: code_reviewer
  output_file: sandbox/docs/code_review_{review_id}.md

apply_decision_task:
  description: >
    Se ha hecho una revisión del sistema y hay que decidir qué hallazgos se aplican. El informe está en el sandbox: {review_file}
    Léelo, y lee el código al que se refiere (backend, app.py y las pruebas) para valorar la viabilidad y el riesgo de cada hallazgo.
    Para cada hallazgo, ACÉPTALO o RECHÁZALO con una razón de una línea. Acepta solo lo que mejore de verdad la mantenibilidad o corrija un error,
    y que tenga riesgo de regresión bajo o esté protegido por pruebas existentes. Rechaza gustos, trivialidades y todo lo que exija rehacer
    la aplicación. Acepta como máximo {max_cambios} cambios en total, que sean independientes entre sí y estén ordenados de menor a mayor riesgo.
    Ningún cambio puede alterar firmas públicas usadas por app.py ni por las pruebas, salvo que el propio cambio incluya su adaptación.
